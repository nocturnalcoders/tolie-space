<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>tolie.space — Christianto Lie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--paper:#fff4dc;--ink:#34243a;--amber:#ffb454;--clay:#8a4a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b18;overflow:hidden;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;z-index:10}
#loc{left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);padding:7px 22px;background:rgba(12,14,34,.74);border:1.5px solid rgba(255,214,150,.4);border-radius:999px;font-size:15px;letter-spacing:.06em;opacity:0;transition:opacity .5s,transform .5s;white-space:nowrap}
#loc.on{opacity:1;transform:translate(-50%,0)}
#score{left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));padding:6px 16px;background:rgba(12,14,34,.74);border:1.5px solid rgba(255,214,150,.4);border-radius:14px;font-size:16px;opacity:0;transition:opacity .4s}
#score.on{opacity:1}
#score b{font-size:20px;color:var(--amber);margin-left:6px}
#btns{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;pointer-events:auto}
#btns button{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,214,150,.45);background:rgba(12,14,34,.74);color:var(--paper);font:500 18px 'Fredoka',sans-serif;cursor:pointer}
#btns button:hover{background:rgba(60,44,90,.85)}
#btns button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#help{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:14px;opacity:0;transition:opacity .8s;background:rgba(12,14,34,.7);padding:7px 16px;border-radius:999px;white-space:nowrap}
#help.on{opacity:.9}
#dlg{position:fixed;left:50%;bottom:calc(max(22px,17vh) + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:min(640px,calc(100vw - 28px));background:#fff6e2;color:var(--ink);border:3px solid #5a3b2e;border-radius:18px;padding:24px 24px 18px;box-shadow:0 7px 0 rgba(0,0,0,.28),0 18px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dName{position:absolute;left:18px;top:-17px;background:#e8744f;color:#fff;border:3px solid #5a3b2e;border-radius:12px;padding:3px 16px;font-weight:600;font-size:15px}
#dText{font-size:19px;line-height:1.5;min-height:58px;white-space:pre-wrap}
#dLinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dLinks a{color:#fff;background:#3f6aa8;border:2px solid #2d4b7a;border-radius:999px;padding:5px 15px;font-size:14px;text-decoration:none;font-weight:500}
#dLinks a:hover{background:#4a79c0}
#dLinks a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#dNext{position:absolute;right:20px;bottom:9px;font-size:14px;color:#e8744f;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 28%,rgba(255,196,107,.2),transparent 58%),rgba(6,9,24,.58);backdrop-filter:blur(3px);transition:opacity .9s;cursor:pointer}
#title.off{opacity:0;pointer-events:none}
#title h1{margin:0;font-weight:600;font-size:clamp(44px,10vw,96px);letter-spacing:.02em;color:#fff4dc;text-shadow:0 4px 0 #8a4a2e,0 12px 34px rgba(255,170,90,.4)}
#title p{margin:0;opacity:.88;font-size:clamp(15px,2.6vw,20px)}
#start{margin-top:22px;padding:12px 30px;border-radius:999px;background:var(--amber);color:#3a2314;font:600 18px 'Fredoka',sans-serif;border:3px solid var(--clay);box-shadow:0 5px 0 var(--clay);cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-3px)}}
#keys{margin-top:14px;font-size:14px;opacity:.7}
#fade{position:fixed;inset:0;background:#05070f;opacity:0;pointer-events:none;z-index:25}
#joy,#act{display:none;position:fixed;z-index:15;touch-action:none}
#joy{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,244,220,.1);border:2px solid rgba(255,244,220,.3)}
#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(255,244,220,.45);border:2px solid rgba(255,244,220,.7)}
#act{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;background:rgba(255,180,84,.55);border:3px solid rgba(255,244,220,.8);color:#fff;font:600 24px 'Fredoka',sans-serif}
body.play.touch #joy,body.play.touch #act{display:block}
@media (prefers-reduced-motion:reduce){#start,#dNext{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loc" class="hud"></div>
<div id="score" class="hud">Goals<b id="goals">0</b></div>
<div id="btns" class="hud"><button id="bNight" aria-label="Toggle day and night" title="Day / night (N)">&#9790;</button><button id="bSnd" aria-label="Toggle sound" title="Sound (M)">&#9835;</button></div>
<div id="help" class="hud">WASD or arrows to move &middot; Shift to run &middot; E to interact or shoot</div>
<div id="dlg" role="dialog" aria-live="polite"><div id="dName"></div><div id="dText"></div><div id="dLinks"></div><div id="dNext">&#9660;</div></div>
<div id="title"><h1>tolie.space</h1><p>Christianto Lie’s little town</p><button id="start" disabled>Loading…</button><div id="keys">Best with sound on</div></div>
<div id="joy"><div id="knob"></div></div><button id="act" aria-label="Interact">E</button>
<div id="fade"></div>

<script>
(()=>{
'use strict';

/* =====================================================================
   CONTENT — edit the words here
   ===================================================================== */
const C={
  name:'Christianto Lie', role:'Senior Software Engineer',
  github:'https://github.com/nocturnalcoders',
  blog:'https://blog.tolie.space', lab:'https://lab.tolie.space'
};
const DL={
  sign:{name:'Signpost',pages:['Welcome to tolie.space.','I’m Christianto Lie, but most people call me tolie. Senior software engineer, futsal player, night walker.','Wander around, peek inside the houses, and kick the ball on the court. Everything here is me, one way or another.']},
  mail:{name:'Mailbox',pages:['Want to say hi? I’m nocturnalcoders on GitHub.','Longer thoughts live on the blog, and the half-baked experiments live in the lab.'],links:[{t:'GitHub',u:C.github},{t:'Blog',u:C.blog},{t:'Lab',u:C.lab}]},
  cat:{name:'Cat',pages:['Mrrp.','(The cat has no opinion on your code, but it approves of your company.)']},
  homeDesk:{name:'My desk',pages:['This is where the late-night building happens.','Senior software engineer by day, tinkerer by night.'],links:[{t:'GitHub',u:C.github}]},
  trophy:{name:'Futsal shelf',pages:['Boots by the door, ball on the shelf.','Futsal is my reset button. Nothing clears my head like a fast game.']},
  poster:{name:'Poster',pages:['A night walk through the city, painted the way I like to remember it.']},
  bed:{name:'Bed',pages:['Tempting. But there’s still one more commit to push.']},
  workDesk:{name:'Workstation',pages:['Senior Software Engineer.','I like building things that are fast, reliable, and pleasant to use, then sanding off the rough edges.'],links:[{t:'GitHub',u:C.github}]},
  board:{name:'Whiteboard',pages:['Architecture, trade-offs, and the occasional doodle.','Good engineering is mostly good decisions made calmly.']},
  rack:{name:'Server rack',pages:['Blinking lights make everything feel productive.']},
  coffee:{name:'Coffee machine',pages:['Fuel. Always fuel.']},
  blogDesk:{name:'Writing desk',pages:['This is where posts get drafted.','Notes on building software, things I’m learning, and the odd tangent.'],links:[{t:'Open the blog',u:C.blog}]},
  books:{name:'Bookshelf',pages:['Half read, half intended to be read.']},
  nook:{name:'Reading nook',pages:['A good chair, a warm lamp, and a long article.']},
  labScreen:{name:'Experiment console',pages:['Prototypes, odd ideas, and things that might break.','If it’s half-baked but interesting, it lives here.'],links:[{t:'Open the lab',u:C.lab},{t:'GitHub',u:C.github}]},
  bench:{name:'Workbench',pages:['Please do not drink the blue one.']},
  compute:{name:'Compute',pages:['Quietly humming away at something.']}
};

/* =====================================================================
   helpers
   ===================================================================== */
const T=32, WT=52, HT=38, WPX=WT*T, HPX=HT*T;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[n>>16,(n>>8)&255,n&255];}
function shade(h,a){const [r,g,b]=hex2rgb(h);const f=v=>Math.round(clamp(a<0?v*(1+a):v+(255-v)*a,0,255));return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function mix(h1,h2,k){const A=hex2rgb(h1),B=hex2rgb(h2);return 'rgb('+Math.round(lerp(A[0],B[0],k))+','+Math.round(lerp(A[1],B[1],k))+','+Math.round(lerp(A[2],B[2],k))+')';}
function rrect(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function fs(c,fill,stroke,lw){if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke();}}
function shadowE(c,x,y,rx,ry,a){c.fillStyle='rgba(10,12,30,'+(a==null?.28:a)+')';ell(c,x,y,rx,ry);c.fill();}
const FONT='Fredoka, "Trebuchet MS", sans-serif';

/* =====================================================================
   canvas + state
   ===================================================================== */
const cv=$('c'), ctx=cv.getContext('2d');
const lightCv=document.createElement('canvas'), lctx=lightCv.getContext('2d');
let VW=1,VH=1,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);VW=window.innerWidth;VH=window.innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);lightCv.width=Math.ceil(VW/2);lightCv.height=Math.ceil(VH/2);}
window.addEventListener('resize',resize);resize();

const G={ready:false,started:false,scene:'world',night:1,nightT:1,t:0,goals:0,shake:0,trans:null,dlg:null,loc:'',locT:0,helpT:0};
const keys={}, joy={x:0,y:0,run:false};
const P={x:26*T,y:9.4*T,vx:0,vy:0,dir:'down',ph:0,mv:false,acc:0};
const cam={x:0,y:0};

/* =====================================================================
   audio (tiny synth, no files)
   ===================================================================== */
let AC=null, soundOn=true, ambTimer=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,d,type,vol,slide,delay){if(!soundOn)return;const a=audio();if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(vol||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);}
const sfx={tick:()=>tone(560+Math.random()*120,.04,'square',.02),kick:()=>tone(150,.13,'triangle',.13,-95),goal:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.09));},door:()=>{tone(220,.12,'sine',.07,-60);tone(330,.16,'sine',.05,0,.09);},step:()=>tone(80+Math.random()*30,.05,'sine',.025),blip:()=>tone(880,.08,'sine',.05),meow:()=>tone(720,.28,'sawtooth',.03,-320)};
function startAmbient(){if(ambTimer)return;const sc=[196,220,261.6,293.7,329.6,392,440];ambTimer=setInterval(()=>{if(!soundOn||document.hidden)return;const n=sc[Math.floor(Math.random()*sc.length)];tone(n,2.4,'sine',.017);if(Math.random()<.35)tone(n*1.5,2.8,'sine',.009,0,.14);},1500);}

/* =====================================================================
   world layout
   ===================================================================== */
const B={
  home:{id:'home',label:'Home',sign:'HOME',x:23,y:3,w:6,h:5,wall:'#f0e4ca',roof:'#c8553d',trim:'#7a4a2b',chimney:true},
  work:{id:'work',label:'Office',sign:'OFFICE',x:7,y:5,w:8,h:6,wall:'#dbe4f0',roof:'#3f6aa8',trim:'#34455e'},
  blog:{id:'blog',label:'Blog',sign:'BLOG',x:7,y:26,w:6,h:5,wall:'#f4ddc2',roof:'#7a8f3d',trim:'#6b4a2a'},
  lab:{id:'lab',label:'Lab',sign:'LAB',x:39,y:26,w:8,h:5,wall:'#d0e7e2',roof:'#2f7f86',trim:'#2d4b4f',chimney:true}
};
const BL=Object.values(B);
const colliders=[];
function solid(x,y,w,h){colliders.push({x,y,w,h});}
BL.forEach(b=>{
  b.px=b.x*T;b.py=b.y*T;b.pw=b.w*T;b.ph=b.h*T;b.doorX=b.x+b.w/2-1;b.win=[];
  solid(b.px,b.py,b.pw,b.ph-T);
  solid(b.px,b.py+b.ph-T,(b.doorX-b.x)*T,T);
  solid((b.doorX+2)*T,b.py+b.ph-T,(b.x+b.w-b.doorX-2)*T,T);
  b.door={x:b.doorX*T,y:b.py+b.ph-T,w:2*T,h:T};
});

/* futsal court */
const FX0=35*T,FX1=49*T,FY0=8*T,FY1=15*T,GCY=(FY0+FY1)/2,GH=1.7*T,GD=1.5*T;
const FEX0=33*T,FEX1=51*T,FEY0=6*T,FEY1=17*T;
solid(FEX0,FEY0,FEX1-FEX0,6);solid(FEX0,FEY0,6,FEY1-FEY0);solid(FEX1-6,FEY0,6,FEY1-FEY0);
solid(FEX0,FEY1-6,41*T-FEX0,6);solid(43*T,FEY1-6,FEX1-43*T,6);

/* pond */
const pond={x:32*T,y:26.5*T,rx:3.5*T,ry:2.3*T};
const inPond=(x,y)=>Math.pow((x-pond.x)/(pond.rx+6),2)+Math.pow((y-pond.y)/(pond.ry+4),2)<1;

/* paths */
const pathMask=new Uint8Array(WT*HT);
function pr(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<WT&&j<HT)pathMask[j*WT+i]=1;}
pr(4,19,44,2);pr(4,32,44,2);pr(25,8,2,26);pr(10,11,2,8);pr(9,31,2,1);pr(42,31,2,1);pr(41,17,2,2);
for(let j=0;j<HT;j++)for(let i=0;i<WT;i++){if(Math.pow(i+.5-26,2)+Math.pow(j+.5-20,2)<=4.7*4.7)pathMask[j*WT+i]=1;}
const isPath=(i,j)=>i>=0&&j>=0&&i<WT&&j<HT&&pathMask[j*WT+i]===1;

/* lamps */
const LAMPS=[[22.4,17.2],[29.6,17.2],[22.4,23.0],[29.6,23.0],[24,8.7],[28,8.7],[9,12.2],[13,12.2],[8,31.6],[12,31.6],[41,31.6],[45,31.6],[24,33.8],[28,33.8],[17,21.4],[35,21.4]].map(p=>({x:p[0]*T,y:p[1]*T}));
LAMPS.forEach(l=>solid(l.x-3,l.y-4,6,6));

/* props */
const SIGN={x:26*T,y:17.5*T};solid(SIGN.x-5,SIGN.y-5,10,7);
const MAIL={x:23.2*T,y:21.8*T};solid(MAIL.x-4,MAIL.y-4,8,6);
const CAT={x:13.6*T,y:31.3*T};
const BENCHES=[{x:30.6*T,y:23.5*T},{x:21.2*T,y:22.6*T}];
BENCHES.forEach(b=>solid(b.x-14,b.y-6,28,8));
const worldInter=[
  {x:SIGN.x,y:SIGN.y-6,r:34,dlg:'sign'},
  {x:MAIL.x,y:MAIL.y-6,r:30,dlg:'mail'},
  {x:CAT.x,y:CAT.y-6,r:30,dlg:'cat'}
];

/* trees */
const TREEL=[];
(function(){
  const R=mulberry(2026);
  const near=(tx,ty)=>{
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(isPath(tx+i,ty+j))return true;
    for(const b of BL){if(tx>=b.x-1&&tx<=b.x+b.w&&ty>=b.y-1&&ty<=b.y+b.h+2)return true;}
    if(tx>=32&&tx<=51&&ty>=5&&ty<=17)return true;
    if(Math.pow((tx+.5-32)/4.8,2)+Math.pow((ty+.5-26.5)/3.6,2)<1)return true;
    if(Math.abs(tx-13.6)<2&&Math.abs(ty-31.3)<2)return true;
    return false;
  };
  const taken=new Set();
  for(let ty=0;ty<HT;ty++)for(let tx=0;tx<WT;tx++){
    const edge=tx<2||ty<2||tx>=WT-2||ty>=HT-2;
    const p=edge?.9:(tx<4||ty<4||tx>=WT-4||ty>=HT-4)?.35:.055;
    if(R()<p&&!near(tx,ty)){
      let ok=true;
      for(let j=-1;j<=1&&ok;j++)for(let i=-1;i<=1;i++){if(taken.has((tx+i)+','+(ty+j))&&!edge){ok=false;break;}}
      if(!ok)continue;
      taken.add(tx+','+ty);
      const kind=R()<.2?3:R()<.45?2:R()<.5?1:0;
      const tr={x:tx*T+T/2,y:ty*T+T,k:kind,s:.9+R()*.3,ph:R()*6};
      TREEL.push(tr);
      solid(tr.x-6,tr.y-9,12,8);
    }
  }
})();

/* fireflies */
const FF=[];
(function(){const R=mulberry(11);for(let i=0;i<46;i++)FF.push({x:R()*WPX,y:R()*HPX,a:R()*6.28,sp:6+R()*10,ph:R()*6,r:2+R()*1.6});})();

/* lights (static, world) */
const LIGHTS=[];
function addLight(x,y,r,c,a,fl){LIGHTS.push({x,y,r,c,a:a||1,fl:fl||0,ph:Math.random()*6});}
LAMPS.forEach(l=>addLight(l.x,l.y-30,120,'255,196,110',1,.05));
BL.forEach(b=>{addLight(b.px+b.pw/2,b.py+b.ph+8,86,'255,190,100',.9,.03);});
[[33.5,6.5],[50.5,6.5],[33.5,16.5],[50.5,16.5],[42,6.5],[42,16.5]].forEach(p=>addLight(p[0]*T,p[1]*T,170,'190,220,255',.95,0));
addLight(SIGN.x,SIGN.y-20,70,'255,200,120',.7,.04);
addLight(MAIL.x,MAIL.y-10,40,'255,200,120',.5,0);

/* =====================================================================
   interiors
   ===================================================================== */
const INT={
  home:{w:12,h:9,floor:'#c9a070',wall:'#ead8b8',obj:[
    {t:'window',x:1.4,y:.5,w:2,h:2},{t:'window',x:8.6,y:.5,w:2,h:2},
    {t:'poster',x:5.2,y:.5,w:1.7,h:1.4,dlg:'poster'},
    {t:'rug',x:3.6,y:5.2,w:5,h:2.6},
    {t:'bed',x:.8,y:2.6,w:2.6,h:3.4,dlg:'bed',col:[0,.9,2.6,2.5]},
    {t:'trophy',x:4.4,y:1.9,w:2.6,h:1.9,dlg:'trophy',col:[0,.7,2.6,1.2]},

const GS=1.5, SPR=2;
let ground=null, TSPR=[];
function buildGround(){
  ground=document.createElement('canvas');ground.width=Math.round(WPX*GS);ground.height=Math.round(HPX*GS);
  const g=ground.getContext('2d');g.scale(GS,GS);
  const R=mulberry(7);
  for(let ty=0;ty<HT;ty++)for(let tx=0;tx<WT;tx++){
    const n=noise(tx*.2,ty*.2),n2=noise(tx*.9+40,ty*.9+9);
    g.fillStyle='hsl('+(96+n*22)+','+(36+n*10)+'%,'+(32+n*11+n2*3)+'%)';
    g.fillRect(tx*T-.5,ty*T-.5,T+1,T+1);
  }
  for(let ty=0;ty<HT;ty++)for(let tx=0;tx<WT;tx++){
    if(isPath(tx,ty))continue;
    for(let k=0;k<3;k++){
      const x=tx*T+R()*T,y=ty*T+R()*T,l=R()<.5?'rgba(190,230,120,.35)':'rgba(20,70,30,.35)';
      g.strokeStyle=l;g.lineWidth=1.1;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y-4);g.moveTo(x,y);g.lineTo(x+.5,y-5);g.moveTo(x,y);g.lineTo(x+2.5,y-3.5);g.stroke();
    }
    if(R()<.11){
      const cols=['#fff6d8','#ffd86b','#ff9ab8','#c9a6ff'];const x=tx*T+R()*T,y=ty*T+R()*T;
      for(let k=0;k<3;k++){g.fillStyle=cols[Math.floor(R()*4)];ell(g,x+R()*8-4,y+R()*6-3,1.8,1.8);g.fill();}
    }
  }
  /* cobblestone paths */
  for(let ty=0;ty<HT;ty++)for(let tx=0;tx<WT;tx++){
    if(!isPath(tx,ty))continue;
    const n=noise(tx*.5,ty*.5);
    g.fillStyle='hsl('+(34+n*8)+',32%,'+(66+n*8)+'%)';g.fillRect(tx*T-.5,ty*T-.5,T+1,T+1);
    for(let k=0;k<6;k++){
      const x=tx*T+(k%3)*11+R()*4+3,y=ty*T+Math.floor(k/3)*16+R()*4+4;
      g.fillStyle='hsl('+(30+R()*14)+',28%,'+(60+R()*16)+'%)';rrect(g,x-4,y-3,9+R()*3,7,3);g.fill();
      g.strokeStyle='rgba(110,80,46,.28)';g.lineWidth=.8;g.stroke();
    }
    const edges=[[0,-1,0,0,T,0],[0,1,0,T,T,T],[-1,0,0,0,0,T],[1,0,T,0,T,T]];
    for(const e of edges){
      if(!isPath(tx+e[0],ty+e[1])){
        g.strokeStyle='rgba(96,70,40,.55)';g.lineWidth=3;g.beginPath();g.moveTo(tx*T+e[2],ty*T+e[3]);g.lineTo(tx*T+e[4],ty*T+e[5]);g.stroke();
        g.strokeStyle='rgba(40,90,40,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(tx*T+e[2]-e[0]*2,ty*T+e[3]-e[1]*2);g.lineTo(tx*T+e[4]-e[0]*2,ty*T+e[5]-e[1]*2);g.stroke();
      }
    }
  }
  /* plaza mosaic */
  g.strokeStyle='rgba(120,86,52,.45)';g.lineWidth=2;
  [1.6*T,3.1*T].forEach(r=>{g.beginPath();g.arc(26*T,20*T,r,0,Math.PI*2);g.stroke();});
  for(let a=0;a<8;a++){const an=a*Math.PI/4;g.beginPath();g.moveTo(26*T+Math.cos(an)*1.6*T,20*T+Math.sin(an)*1.6*T);g.lineTo(26*T+Math.cos(an)*3.1*T,20*T+Math.sin(an)*3.1*T);g.stroke();}
  g.fillStyle='rgba(232,116,79,.5)';g.beginPath();g.arc(26*T,20*T,.7*T,0,Math.PI*2);g.fill();
  /* futsal court */
  for(let ty=6;ty<17;ty++)for(let tx=33;tx<51;tx++){const n=noise(tx*.4,ty*.4);g.fillStyle='hsl(212,'+(12+n*8)+'%,'+(46+n*6)+'%)';g.fillRect(tx*T-.5,ty*T-.5,T+1,T+1);}
  for(let i=0;i<14;i++){g.fillStyle=i%2?'#3f9a5c':'#47a863';g.fillRect(FX0+i*T,FY0,T,FY1-FY0);}
  g.strokeStyle='rgba(255,255,255,.92)';g.lineWidth=2.4;g.strokeRect(FX0,FY0,FX1-FX0,FY1-FY0);
  g.beginPath();g.moveTo((FX0+FX1)/2,FY0);g.lineTo((FX0+FX1)/2,FY1);g.stroke();
  g.beginPath();g.arc((FX0+FX1)/2,GCY,1.5*T,0,Math.PI*2);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc((FX0+FX1)/2,GCY,3,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(FX0,GCY,2.5*T,-Math.PI/2,Math.PI/2);g.stroke();
  g.beginPath();g.arc(FX1,GCY,2.5*T,Math.PI/2,Math.PI*1.5);g.stroke();
  [[FX0-GD,-1],[FX1,1]].forEach(gl=>{
    const x0=gl[0],y0=GCY-GH/2;
    g.fillStyle='rgba(255,255,255,.14)';g.fillRect(x0,y0,GD,GH);
    g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=.8;
    for(let i=0;i<=GD;i+=6){g.beginPath();g.moveTo(x0+i,y0);g.lineTo(x0+i,y0+GH);g.stroke();}
    for(let j=0;j<=GH;j+=6){g.beginPath();g.moveTo(x0,y0+j);g.lineTo(x0+GD,y0+j);g.stroke();}

  board(FEX0,FEY0,FEX1-FEX0,7);board(FEX0,FEY0,6,FEY1-FEY0);board(FEX1-6,FEY0,6,FEY1-FEY0);
  board(FEX0,FEY1-7,41*T-FEX0,7);board(43*T,FEY1-7,FEX1-43*T,7);
  g.fillStyle='#ffd24a';g.fillRect(41*T-4,FEY1-12,5,12);g.fillRect(43*T-1,FEY1-12,5,12);
  /* pond */
  g.fillStyle='#8d8f8a';ell(g,pond.x,pond.y,pond.rx+7,pond.ry+6);g.fill();
  for(let a=0;a<28;a++){const an=a/28*Math.PI*2;g.fillStyle='hsl(40,6%,'+(52+R()*18)+'%)';ell(g,pond.x+Math.cos(an)*(pond.rx+4),pond.y+Math.sin(an)*(pond.ry+3),5+R()*2,4,an);g.fill();}
  const wg=g.createRadialGradient(pond.x-20,pond.y-14,6,pond.x,pond.y,pond.rx);wg.addColorStop(0,'#8fd8f0');wg.addColorStop(1,'#3a86b8');
  g.fillStyle=wg;ell(g,pond.x,pond.y,pond.rx,pond.ry);g.fill();
  for(let i=0;i<5;i++){const x=pond.x+(R()-.5)*pond.rx*1.3,y=pond.y+(R()-.5)*pond.ry*1.2;g.fillStyle='#4f9b4a';ell(g,x,y,8,5.5);g.fill();g.strokeStyle='#2d6a32';g.lineWidth=1;g.stroke();if(i%2===0){g.fillStyle='#ffb3c8';ell(g,x+1,y-1,2.8,2.8);g.fill();}}
  /* bushes near building corners */
  BL.forEach(b=>{[[b.px-8,b.py+b.ph-4],[b.px+b.pw+8,b.py+b.ph-4]].forEach(p=>{
    for(let i=0;i<3;i++){g.fillStyle=['#3f8a42','#4f9b4a','#3a7a3c'][i];ell(g,p[0]+(i-1)*7,p[1]-i%2*4,9,8);g.fill();g.strokeStyle='rgba(20,60,30,.5)';g.lineWidth=1;g.stroke();}
    for(let i=0;i<5;i++){g.fillStyle=['#ff9ab8','#fff6d8','#ffd86b'][i%3];ell(g,p[0]+R()*18-9,p[1]-R()*10,1.8,1.8);g.fill();}
  });});
}

const parts=[], pops=[];
function puff(x,y,n,col,sp,life,size){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,l:life*(.6+Math.random()*.6),m:life,c:col,s:size||2,k:'dot'});}}
function confetti(x,y){const cols=['#ffd24a','#ff7a8a','#7ad6ff','#8fe3a6','#c9a6ff','#fff'];for(let i=0;i<44;i++){const a=Math.random()*6.28,s=60+Math.random()*180;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,l:1.6,m:1.6,c:cols[i%6],s:3+Math.random()*2,k:'conf',r:Math.random()*6,vr:(Math.random()-.5)*14});}}
const ball={x:(FX0+FX1)/2,y:GCY,vx:0,vy:0,r:6.5,rot:0,reset:0,last:0};
function ballCenter(){ball.x=(FX0+FX1)/2;ball.y=GCY;ball.vx=ball.vy=0;}
function goal(side){
  G.goals++;$('goals').textContent=G.goals;ball.reset=1.7;ball.vx=ball.vy=0;
  confetti(ball.x,ball.y);sfx.goal();G.shake=.7;
  pops.push({x:(FX0+FX1)/2,y:GCY-30,txt:'GOAL!',l:1.8,m:1.8});
}
function updateBall(dt,can){
  const b=ball;
  if(b.reset>0){b.reset-=dt;if(b.reset<=0)ballCenter();return;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;const f=Math.exp(-dt*1.2);b.vx*=f;b.vy*=f;b.rot+=(b.vx/b.r)*dt;
  const r=b.r,inG=Math.abs(b.y-GCY)<GH/2-2;
  if(b.y<FY0+r){b.y=FY0+r;b.vy=Math.abs(b.vy)*.82;}
  if(b.y>FY1-r){b.y=FY1-r;b.vy=-Math.abs(b.vy)*.82;}
  if(b.x<FX0+r){if(inG){if(b.x<FX0-5){goal(-1);return;}}else{b.x=FX0+r;b.vx=Math.abs(b.vx)*.82;}}
  if(b.x>FX1-r){if(inG){if(b.x>FX1+5){goal(1);return;}}else{b.x=FX1-r;b.vx=-Math.abs(b.vx)*.82;}}
  if(G.scene!=='world')return;
  const dx=b.x-P.x,dy=b.y-(P.y-3),d=Math.hypot(dx,dy),md=r+7;
  if(d<md&&d>.01){
    const nx=dx/d,ny=dy/d;b.x=P.x+nx*md;b.y=P.y-3+ny*md;
    const sp=Math.hypot(P.vx,P.vy),imp=Math.max(50,sp*1.15);
    b.vx=P.vx*1.12+nx*imp*.5;b.vy=P.vy*1.12+ny*imp*.5;
    if(G.t-b.last>.14&&sp>22){sfx.kick();b.last=G.t;puff(b.x,b.y,3,'rgba(255,255,255,.6)',30,.3,2);}
  }
}
const DIRV={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]};
function ballNear(){return G.scene==='world'&&ball.reset<=0&&Math.hypot(P.x-ball.x,(P.y-3)-ball.y)<30&&P.x>FEX0&&P.x<FEX1&&P.y>FEY0&&P.y<FEY1;}
function shoot(){const v=DIRV[P.dir];const d=Math.hypot(P.x-ball.x,(P.y-3)-ball.y);const toB=[ball.x-P.x,ball.y-(P.y-3)];
  const dot=toB[0]*v[0]+toB[1]*v[1];let vx=v[0],vy=v[1];if(dot<0){vx=toB[0]/(d||1);vy=toB[1]/(d||1);}
  ball.vx=vx*430;ball.vy=vy*430;sfx.kick();puff(ball.x,ball.y,8,'rgba(255,255,255,.7)',70,.35,2.2);G.shake=Math.max(G.shake,.12);}

function openDlg(key){
  const d=DL[key];if(!d)return;
  G.dlg={d:d,page:0,shown:0,done:false,acc:0};
  $('dName').textContent=d.name;$('dText').textContent='';$('dLinks').innerHTML='';$('dNext').style.visibility='hidden';
  $('dlg').classList.add('on');sfx.blip();if(key==='cat')sfx.meow();
}
function closeDlg(){G.dlg=null;$('dlg').classList.remove('on');}
function advanceDlg(){
  const D=G.dlg;if(!D)return;
  const txt=D.d.pages[D.page];
  if(!D.done){D.shown=txt.length;return;}
  if(D.page<D.d.pages.length-1){D.page++;D.shown=0;D.done=false;D.acc=0;$('dLinks').innerHTML='';sfx.blip();}
  else closeDlg();
}
function updateDlg(dt){
  const D=G.dlg;if(!D||D.done)return;
  const txt=D.d.pages[D.page];
  const before=Math.floor(D.shown);D.shown=Math.min(txt.length,D.shown+dt*52);
  if(Math.floor(D.shown)!==before&&Math.floor(D.shown)%3===0)sfx.tick();
  $('dText').textContent=txt.slice(0,Math.floor(D.shown));
  if(D.shown>=txt.length){
    D.done=true;$('dText').textContent=txt;$('dNext').style.visibility='visible';
    if(D.page===D.d.pages.length-1&&D.d.links){const L=$('dLinks');L.innerHTML='';D.d.links.forEach(l=>{const a=document.createElement('a');a.textContent=l.t;a.href=l.u;a.target='_blank';a.rel='noopener';L.appendChild(a);});}
  }
}

/* =====================================================================
   movement + scenes
   ===================================================================== */
function blockedAt(x,y,list,extra){
  const hx=6,top=y-4,bot=y+2;
  for(let i=0;i<list.length;i++){const c=list[i];if(x+hx>c.x&&x-hx<c.x+c.w&&bot>c.y&&top<c.y+c.h)return true;}
  return extra?extra(x,y):false;
}
function movePlayer(dt,list,bd,extra,can){
  let ix=0,iy=0;
  if(can){
    if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
    if(Math.hypot(joy.x,joy.y)>.18){ix+=joy.x;iy+=joy.y;}
  }
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
  const sp=(keys.shift||joy.run)?170:108;
  const k=1-Math.exp(-dt*(m>0?11:15));
  P.vx+=(ix*sp-P.vx)*k;P.vy+=(iy*sp-P.vy)*k;
  const nx=P.x+P.vx*dt;if(!blockedAt(nx,P.y,list,extra))P.x=nx;else P.vx=0;
  const ny=P.y+P.vy*dt;if(!blockedAt(P.x,ny,list,extra))P.y=ny;else P.vy=0;
  P.x=clamp(P.x,bd.x0,bd.x1);P.y=clamp(P.y,bd.y0,bd.y1);
  const spd=Math.hypot(P.vx,P.vy);P.mv=spd>14;
  if(m>.15){if(Math.abs(ix)>Math.abs(iy)+.01)P.dir=ix>0?'right':'left';else P.dir=iy>0?'down':'up';}
  P.ph+=spd*dt*.17;
  if(P.mv){P.acc+=spd*dt;if(P.acc>24){P.acc=0;sfx.step();if(G.scene==='world')puff(P.x,P.y,2,'rgba(220,200,160,.55)',14,.4,2.2);}}
}
function go(cb){if(G.trans)return;G.trans={a:0,dir:1,cb:cb};}
function enterBuilding(b){
  sfx.door();go(()=>{G.scene=b.id;const I=INT[b.id];buildIntCol(I);P.x=I.w*T/2;P.y=I.h*T-14;P.vx=P.vy=0;P.dir='up';showLoc(b.label);});
}
function exitBuilding(){
  const b=B[G.scene];sfx.door();go(()=>{G.scene='world';P.x=b.door.x+T;P.y=b.py+b.ph+18;P.vx=P.vy=0;P.dir='down';showLoc(areaName());});
}
function showLoc(name){G.loc=name;const el=$('loc');el.textContent=name;el.classList.add('on');G.locT=2.6;}
const AREAS=[{n:'Futsal court',x:42,y:11.5,r:9},{n:'The plaza',x:26,y:20,r:6},{n:'Lily pond',x:32,y:26.5,r:5},{n:'Home street',x:26,y:9,r:5},{n:'Office row',x:11,y:13,r:7},{n:'Blog lane',x:10,y:29,r:6},{n:'Lab yard',x:43,y:30,r:7}];
function areaName(){for(const a of AREAS){if(Math.hypot(P.x/T-a.x,P.y/T-a.y)<a.r)return a.n;}return 'Tolie town';}
function nearestInter(){
  let best=null,bd=1e9;
  if(G.scene==='world'){for(const o of worldInter){const d=Math.hypot(P.x-o.x,(P.y-4)-o.y);if(d<o.r&&d<bd){best=o;bd=d;}}}
  else{const I=INT[G.scene];for(const o of I.obj){if(!o.dlg)continue;const X=o.x*T,Y=o.y*T,W=o.w*T,H=o.h*T;const dx=Math.max(X-P.x,0,P.x-(X+W)),dy=Math.max(Y-P.y,0,P.y-(Y+H));const d=Math.hypot(dx,dy);if(d<28&&d<bd){best={x:X+W/2,y:Y+(o.t==='desk'||o.t==='bed'?0:o.h*T*.4),dlg:o.dlg};bd=d;}}}
  return best;
}
function action(){
  if(!G.started){startGame();return;}
  if(G.trans)return;
  if(G.dlg){advanceDlg();return;}
  if(ballNear()){shoot();return;}
  const o=nearestInter();if(o)openDlg(o.dlg);
}

/* =====================================================================
   update
   ===================================================================== */
function worldScale(){return clamp(Math.min(VH/520,VW/430),.9,2.4);}
function update(dt){
  G.night+=(G.nightT-G.night)*Math.min(1,dt*2.2);
  const can=G.started&&!G.dlg&&!G.trans;
  if(G.scene==='world'){
    movePlayer(dt,colliders,{x0:T,y0:T,x1:WPX-T,y1:HPX-T},inPond,can);
    updateBall(dt,can);
    if(can){for(const b of BL){const d=b.door;if(P.x>d.x+4&&P.x<d.x+d.w-4&&P.y>d.y+4&&P.y<d.y+T-6){enterBuilding(b);break;}}}
    const S=worldScale(),vw=VW/S,vh=VH/S;
    let tx=P.x+P.vx*.3-vw/2,ty=P.y-14+P.vy*.3-vh/2;
    tx=WPX<=vw?(WPX-vw)/2:clamp(tx,0,WPX-vw);ty=HPX<=vh?(HPX-vh)/2:clamp(ty,0,HPX-vh);
    const k=1-Math.exp(-dt*5);if(!G.camInit){cam.x=tx;cam.y=ty;G.camInit=true;}cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
    const inCourt=P.x>FEX0&&P.x<FEX1&&P.y>FEY0&&P.y<FEY1;$('score').classList.toggle('on',inCourt&&G.started);
    if(G.started){G.areaT=(G.areaT||0)-dt;if(G.areaT<=0){G.areaT=.4;const n=areaName();if(n!==G.area){G.area=n;showLoc(n);}}}
    BL.forEach(b=>{if(b.smoke&&Math.random()<dt*2.2)parts.push({x:b.smoke.x+(Math.random()-.5)*4,y:b.smoke.y,vx:6+Math.random()*6,vy:-16-Math.random()*8,l:2.4,m:2.4,c:'rgba(230,230,240,.5)',s:3,k:'smoke'});});
    for(const f of FF){f.a+=(Math.random()-.5)*dt*3;f.x+=Math.cos(f.a)*f.sp*dt;f.y+=Math.sin(f.a)*f.sp*dt*.7;if(f.x<0)f.x=WPX;if(f.x>WPX)f.x=0;if(f.y<0)f.y=HPX;if(f.y>HPX)f.y=0;}
  } else {
    const I=INT[G.scene],Wp=I.w*T,Hp=I.h*T,d0=Wp/2-T,d1=Wp/2+T;
    movePlayer(dt,intCol,{x0:T*.8,y0:3*T+8,x1:Wp-T*.8,y1:Hp+14},(x,y)=>(y>Hp-8&&(x<d0+6||x>d1-6)),can);
    if(can&&P.y>Hp+6&&P.x>d0&&P.x<d1)exitBuilding();
    $('score').classList.remove('on');
  }
  if(G.trans){const T2=G.trans;T2.a+=dt*3.4*T2.dir;if(T2.dir===1&&T2.a>=1){T2.a=1;T2.dir=-1;T2.cb();}else if(T2.dir===-1&&T2.a<=0){G.trans=null;}}
  updateDlg(dt);
  G.shake=Math.max(0,G.shake-dt*1.6);
  if(G.locT>0){G.locT-=dt;if(G.locT<=0)$('loc').classList.remove('on');}
  if(G.helpT>0){G.helpT-=dt;if(G.helpT<=0)$('help').classList.remove('on');}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='conf'){p.vy+=360*dt;p.r+=p.vr*dt;}else if(p.k==='smoke'){p.s+=dt*4;}else{p.vy+=30*dt;}}
  for(let i=pops.length-1;i>=0;i--){pops[i].l-=dt;if(pops[i].l<=0)pops.splice(i,1);}
}

function renderWorld(dt){

  ctx.font='600 13px '+FONT;ctx.fillStyle='#ffd24a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GOALS  '+G.goals,42*T-10+10,FEY0-11);

  ctx.setTransform(S*DPR,0,0,S*DPR,-cx*S*DPR,-cy*S*DPR);
  for(const L of vis){const gr=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);gr.addColorStop(0,'rgba('+L.c+','+(.26*k*L.a)+')');gr.addColorStop(1,'rgba('+L.c+',0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(L.x,L.y,L.r,0,6.3);ctx.fill();}

function renderInterior(){
  const I=INT[G.scene],Wp=I.w*T,Hp=I.h*T,t=G.t;
  const Si=clamp(Math.min(VW/(Wp+56),VH/(Hp+56)),.8,3),ox=(VW/Si-Wp)/2,oy=(VH/Si-Hp)/2;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#090c1c';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(Si*DPR,0,0,Si*DPR,ox*Si*DPR,oy*Si*DPR);
  ctx.fillStyle='#2a1c26';ctx.fillRect(-10,-10,Wp+20,Hp+22);
  /* floor */
  for(let ty=3;ty<I.h;ty++)for(let tx=0;tx<I.w;tx++){const n=hash2(tx,ty);ctx.fillStyle=shade(I.floor,(n-.5)*.12);ctx.fillRect(tx*T,ty*T,T,T);}
  ctx.strokeStyle='rgba(60,36,20,.28)';ctx.lineWidth=1;for(let ty=3;ty<=I.h;ty++){ctx.beginPath();ctx.moveTo(0,ty*T);ctx.lineTo(Wp,ty*T);ctx.stroke();}
  for(let ty=3;ty<I.h;ty++)for(let tx=0;tx<I.w;tx++){const off=hash2(tx,ty+50)*T;ctx.beginPath();ctx.moveTo(tx*T+off,ty*T);ctx.lineTo(tx*T+off,ty*T+T);ctx.stroke();}
  /* wall */
  const wg=ctx.createLinearGradient(0,0,0,3*T);wg.addColorStop(0,shade(I.wall,-.1));wg.addColorStop(1,I.wall);ctx.fillStyle=wg;ctx.fillRect(0,0,Wp,3*T);
  ctx.strokeStyle='rgba(120,80,60,.08)';ctx.lineWidth=6;for(let x=8;x<Wp;x+=22){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,2*T);ctx.stroke();}
  ctx.fillStyle=shade(I.floor,-.25);ctx.fillRect(0,2*T,Wp,T);ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;for(let x=0;x<Wp;x+=T*1.5){ctx.strokeRect(x+4,2*T+5,T*1.5-8,T-10);}
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,3*T-3,Wp,3);ctx.fillStyle=shade(I.floor,.15);ctx.fillRect(0,2*T-2,Wp,3);
  ctx.fillStyle='#1c1220';ctx.fillRect(0,0,Wp,5);
  /* doorway */
  const d0=Wp/2-T,dg=ctx.createLinearGradient(0,Hp-4,0,Hp+14);dg.addColorStop(0,'rgba(120,160,220,.1)');dg.addColorStop(1,mix('#8fb8ff','#1b2a5e',G.night));
  ctx.fillStyle='#14101c';ctx.fillRect(-10,Hp,Wp+20,16);ctx.fillStyle=dg;ctx.fillRect(d0,Hp-4,2*T,18);
  ctx.fillStyle='#8a4a2e';rrect(ctx,d0+6,Hp-8,2*T-12,7,3);ctx.fill();ctx.fillStyle='#fff4dc';ctx.font='600 9px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('EXIT',Wp/2,Hp-4.5);
  /* wall decor, rugs, then sorted */
  const wallT={window:1,poster:1,board:1,screen:1};
  I.obj.forEach(o=>{if(wallT[o.t])FUR[o.t](ctx,o);});
  I.obj.forEach(o=>{if(o.t==='rug')FUR.rug(ctx,o);});
  const list=[];I.obj.forEach(o=>{if(!wallT[o.t]&&o.t!=='rug')list.push({y:(o.y+o.h)*T,f:()=>FUR[o.t](ctx,o)});});
  list.push({y:P.y,f:()=>drawChibi(ctx,P.x,P.y,P.dir,P.ph,P.mv,t)});
  list.sort((a,b)=>a.y-b.y);list.forEach(o=>o.f());

  ctx.globalCompositeOperation='lighter';

}

/* =====================================================================
   frame
   ===================================================================== */
let last=0;
function render(dt){
  if(G.scene==='world')renderWorld(dt);else renderInterior();
  if(G.trans){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(5,7,15,'+clamp(G.trans.a,0,1)+')';ctx.fillRect(0,0,VW,VH);}
}
function frame(now){
  const dt=Math.min(.05,((now-last)/1000)||.016);last=now;G.t+=dt;
  update(dt);render(dt);
  requestAnimationFrame(frame);
}

/* =====================================================================
   input + start
   ===================================================================== */
function startGame(){
  if(G.started||!G.ready)return;
  G.started=true;document.body.classList.add('play');$('title').classList.add('off');
  audio();startAmbient();sfx.blip();G.helpT=7;$('help').classList.add('on');showLoc('Home street');G.area='Home street';
}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0)e.preventDefault();
  if(k==='shift'){keys.shift=true;return;}
  if(!G.started){if(k==='enter'||k===' '||k==='e')startGame();return;}
  if(k==='e'||k==='enter'||k===' '){if(!e.repeat)action();return;}
  if(k==='n'){toggleNight();return;}
  if(k==='m'){toggleSound();return;}
  keys[k]=true;
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='shift')keys.shift=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.x=joy.y=0;});
$('title').addEventListener('click',startGame);$('start').addEventListener('click',e=>{e.stopPropagation();startGame();});
$('dlg').addEventListener('click',e=>{if(e.target.tagName==='A')return;advanceDlg();});
function toggleNight(){G.nightT=G.nightT>.5?0:1;sfx.blip();}
function toggleSound(){soundOn=!soundOn;$('bSnd').style.opacity=soundOn?1:.45;}
$('bNight').addEventListener('click',toggleNight);$('bSnd').addEventListener('click',toggleSound);
if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
(function(){
  const j=$('joy'),kn=$('knob');let id=null,cx=0,cy=0;const R=44;
  const mv=e=>{let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R;}kn.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R;joy.run=m>R*.96;};
  j.addEventListener('pointerdown',e=>{id=e.pointerId;try{j.setPointerCapture(id);}catch(x){}const r=j.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;mv(e);});
  j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
  const up=e=>{if(e.pointerId!==id)return;id=null;joy.x=joy.y=0;joy.run=false;kn.style.transform='translate(0,0)';};
  j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up);
  $('act').addEventListener('pointerdown',e=>{e.preventDefault();action();});
})();

/* =====================================================================
   init
   ===================================================================== */
async function init(){
  try{await Promise.race([document.fonts.load('600 14px Fredoka'),new Promise(r=>setTimeout(r,1600))]);}catch(e){}
  await new Promise(r=>requestAnimationFrame(()=>r()));
  buildGround();BL.forEach(b=>{b.spr=renderBuilding(b);});TSPR=[0,1,2,3].map(treeSprite);
  G.ready=true;const s=$('start');s.disabled=false;s.textContent='Press Enter or tap to start';
  last=performance.now();requestAnimationFrame(frame);
}
window.__tolie={G:G,P:P,B:B,INT:INT,ball:ball,enterBuilding:enterBuilding,action:action,startGame:startGame};
init();
})();
